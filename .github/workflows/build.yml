name: Build

on:
  push:
    branches: '*'
  pull_request:
    branches: '*'
  workflow_dispatch:
    inputs:
      SIGN_WINDOWS_INSTALLER:
        description: 'Sign Windows Installer'
        required: true
        type: boolean
        default: false

# Only keep the latest run per ref going: a newer push cancels the older,
# still-running build instead of queueing behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release
  # This matrix builds the client only (-Dserver=OFF), which also takes the server's
  # database layer, SOCI and Ice out of the build.
  # -Dwebrtc-audio-processing=ON is the default, but set explicitly so the AEC3 echo
  # cancellation and noise suppression are guaranteed to be compiled in and linked.
  # -Ddeepfilternet=ON builds the bundled DeepFilterNet3 noise suppressor, model
  # included, via the Rust toolchain preinstalled on the GitHub-hosted runners;
  # TestDeepFilterModel then asserts it really ended up in the binary.
  CMAKE_OPTIONS: -Dtests=ON -Dserver=OFF -Dwebrtc-audio-processing=ON -Ddeepfilternet=ON -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_C_COMPILER_LAUNCHER=ccache


jobs:

  fetch_build_number:
    runs-on: ubuntu-latest
    outputs:
      build_number: ${{ steps.fetch.outputs.build_number }}
    steps:
      - uses: actions/checkout@v6
        with:
            fetch-depth: 1
      - id: fetch
        shell: bash
        run: |
          build_version="$("${{ github.workspace }}/scripts/mumble-version.py")"
          build_number="$("${{ github.workspace }}/scripts/mumble-build-number.py" \
            --commit "${{ github.sha }}" --version "${build_version}" \
            --password "${{ secrets.BUILD_NUMBER_TOKEN }}" --default "${{ github.run_number }}")"
          # The central build-number service only assigns numbers for the upstream
          # repository. On forks every build otherwise stayed at build number 0, i.e.
          # the same version (e.g. 1.7.0), so the Windows installer saw no version
          # change and silently refused to update an existing installation. Use the
          # monotonic run number on forks so each build gets a strictly higher version.
          if [ "${{ github.repository }}" != "mumble-voip/mumble" ]; then
            build_number="${{ github.run_number }}"
          fi
          echo "Build Number: ${build_version}.${build_number}"
          echo "build_number=${build_number}" >> "$GITHUB_OUTPUT"


  build:
    needs: [ fetch_build_number ]

    strategy:
        fail-fast: false
        matrix:
            # Ubuntu is not built here: the releases we target (25.10 and 26.04) have no
            # GitHub runner image, so they are covered by the container-based job below,
            # which also produces the .deb. What is left are the two platforms that ship
            # a client installer: Windows (x86_64) and macOS on Apple Silicon (arm64).
            include:
              - { os: windows-2025-vs2026, type: static, arch: x86_64 }
              - { os: macos-26, type: static, arch: arm64 }

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v6
      with:
          submodules: 'recursive'
          fetch-depth: 1


      # The Bash version installed on macOS is ancient. We need a newer version
    - name: Install Bash
      if: ${{ startsWith(matrix.os, 'macos') }}
      run: brew install bash

    - name: Set environment variables
      run: $GITHUB_WORKSPACE/.github/workflows/set_environment_variables.sh "${{ matrix.os }}" "${{ matrix.type }}" "${{ matrix.arch }}" "${{ github.workspace }}"
      shell: bash

    - uses: actions/cache/restore@v5
      with:
          path: '${{ env.MUMBLE_ENVIRONMENT_DIR }}'
          key: ${{ env.MUMBLE_ENVIRONMENT_VERSION }}

    - uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: ${{ github.base_ref || github.ref_name }}.${{ matrix.os }}.${{ matrix.type }}
        save: ${{ github.event_name != 'pull_request' }}
        append-timestamp: false

    - uses: ./.github/actions/install-dependencies
      with:
          type: ${{ matrix.type }}
          os: ${{ matrix.os }}
          arch: ${{ matrix.arch }}

    - name: Build
      run: ./.github/workflows/build.sh "${{ matrix.os }}" "${{ matrix.type }}" "${{ matrix.arch }}"
      shell: bash
      env:
          MUMBLE_BUILD_NUMBER: ${{ needs.fetch_build_number.outputs.build_number }}

    - name: Test
      working-directory: ${{ github.workspace }}/build
      shell: bash
      run: ctest --output-on-failure -C $BUILD_TYPE

      # The arm64 runners ship with little free disk, and a static build leaves several
      # gigabytes of intermediates behind - enough that hdiutil is left with nowhere to
      # build the image ("No space left on device"). Past this point nothing is needed
      # but the app bundle and the plugins that go into it.
    - if: ${{ startsWith(matrix.os, 'macos') }}
      name: Free disk space
      shell: bash
      run: |
        df -h /
        du -sh build build_env 2> /dev/null || true

        # The Rust target directory and the (statically linked, hence large) test
        # binaries are the bulk of it; both have served their purpose by now.
        rm -rf build/cargo build/tests
        find build -name '*.o' -delete

        df -h /

      # Turn the built .app into an installable disk image: the plugins and the icon are
      # copied into the bundle, its Info.plist gets the real version, and the result is
      # ad-hoc signed (Apple Silicon refuses to run binaries carrying no signature at
      # all). Signing it with a Developer ID instead needs a paid Apple account, so the
      # image is installed through the Homebrew cask rather than by hand - see
      # docs/dev/maintenance/signing-ci-builds.md. The overlay is not built on ARM macOS,
      # hence --no-overlay.
    - if: ${{ startsWith(matrix.os, 'macos') }}
      name: Create disk image
      shell: bash
      run: |
        ./macx/scripts/osxdist.py --source-dir . --binary-dir build --no-overlay --ad-hoc-sign \
          --min-macos-version "11.0.0" \
          --version "$( ./scripts/mumble-version.py ).${MUMBLE_BUILD_NUMBER}"
      env:
          MUMBLE_BUILD_NUMBER: ${{ needs.fetch_build_number.outputs.build_number }}

    - if: ${{ inputs.SIGN_WINDOWS_INSTALLER && startsWith(matrix.os, 'windows') }}
      uses: ./.github/actions/sign-binaries
      with:
          signpath-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          build-number: ${{ needs.fetch_build_number.outputs.build_number }}
          type: ${{ matrix.type }}
          os: ${{ matrix.os }}
          arch: ${{ matrix.arch }}

    - if: ${{ !inputs.SIGN_WINDOWS_INSTALLER && matrix.type == 'static' }}
      name: Publish
      uses: actions/upload-artifact@v7
      with:
        name: 'Mumble-${{ matrix.os }}'
        # Maximum compression costs far more time than it saves on an artifact that is
        # mostly already-compressed installers and disk images.
        compression-level: 1
        path: |
          build/*.dmg
          build/**/mumble*.msi
          build/**/mumble*.exe
          build/**/plugins/*.pdb
          build/**/mumble.pdb
          build/**/mumble_ol*.pdb
          build/**/rnnoise.pdb
          build/**/speexdsp.pdb

      # We don't want to save the build env in a cache on a PR as caches are scoped
      # to branches and while PRs can access caches from the default branch, they
      # can't access the cache of other PRs. Hence, it is kind of a waste to save
      # the cache on a PR
    - if: ${{ matrix.type  == 'static' && github.event_name != 'pull_request' }}
      uses: actions/cache/save@v5
      with:
          path: '${{ env.MUMBLE_ENVIRONMENT_DIR }}'
          key: ${{ env.MUMBLE_ENVIRONMENT_VERSION }}


  # Build an installable Mumble client .deb on the Ubuntu releases we target. Neither is
  # available as a GitHub runner image, so their official containers are used. This is a
  # shared build that links against the distribution's system libraries and, being the
  # only Linux build left, it is also the one that runs the test suite there. The server
  # and the 32-bit overlay are left out to keep the package build self-contained on a
  # bare container (no multilib, no database server).
  package_deb:
    needs: [ fetch_build_number ]

    strategy:
        fail-fast: false
        matrix:
            include:
              - { image: "ubuntu:25.10", label: "ubuntu-25.10" }
              - { image: "ubuntu:26.04", label: "ubuntu-26.04" }

    runs-on: ubuntu-latest
    container: ${{ matrix.image }}

    steps:
      # git (for the recursive submodule checkout) and the build toolchain have to be
      # installed before anything else, as the base image ships none of them. dpkg-dev
      # provides dpkg-shlibdeps, which CPack uses to resolve the package dependencies.
    - name: Install build dependencies
      shell: bash
      run: |
        export DEBIAN_FRONTEND=noninteractive
        apt-get update
        apt-get install -y --no-install-recommends \
          ca-certificates git cmake ninja-build pkg-config dpkg-dev file python3 \
          build-essential \
          cargo rustc \
          qt6-base-dev qt6-svg-dev qt6-tools-dev qt6-tools-dev-tools qt6-l10n-tools libgl-dev \
          libboost-dev libssl-dev \
          libprotobuf-dev protobuf-compiler libprotoc-dev \
          libcap-dev libxi-dev libpoco-dev \
          libasound2-dev libogg-dev libsndfile1-dev libopus-dev \
          libspeechd-dev libavahi-compat-libdnssd-dev appstream

    - uses: actions/checkout@v6
      with:
          submodules: 'recursive'
          fetch-depth: 1

      # The checkout runs as root inside the container, so mark the tree as a safe
      # git directory to avoid "dubious ownership" errors from any later git calls.
    - name: Mark workspace as safe
      shell: bash
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # warnings-as-errors is left off here: these are bleeding-edge distributions whose
      # GCC keeps gaining new diagnostics, and the goal of this job is to produce a
      # package rather than to gate on them. The matrix above still builds warning-clean
      # with MSVC and clang.
    - name: Configure
      shell: bash
      run: |
        cmake -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_INSTALL_PREFIX=/usr \
          -DCMAKE_UNITY_BUILD=ON \
          -DBUILD_NUMBER="$MUMBLE_BUILD_NUMBER" \
          -Dtests=ON \
          -Dserver=OFF \
          -Doverlay-xcompile=OFF \
          -Dwarnings-as-errors=OFF \
          -Dwebrtc-audio-processing=ON \
          -Ddeepfilternet=ON \
          -Dstatic=OFF \
          -Ddeb-package=ON
      env:
          MUMBLE_BUILD_NUMBER: ${{ needs.fetch_build_number.outputs.build_number }}

    - name: Build
      shell: bash
      run: cmake --build build --parallel

      # The container has no display, so the tests are run through Qt's offscreen platform
      # plugin (shipped by qt6-base-dev), just like the Linux builds of the matrix did.
    - name: Test
      working-directory: build
      shell: bash
      run: ctest --output-on-failure
      env:
          QT_QPA_PLATFORM: offscreen

    - name: Package
      working-directory: build
      shell: bash
      run: cpack -G DEB

    - name: Publish .deb
      uses: actions/upload-artifact@v7
      with:
        name: 'Mumble-${{ matrix.label }}-deb'
        compression-level: 9
        path: build/*.deb


  # Every push to master becomes a GitHub release carrying the installable client
  # packages: the macOS (arm64) disk image, the Windows installer and the Ubuntu .deb
  # of each targeted release. The tag reuses the exact version the builds were stamped
  # with (mumble-version.py plus the monotonic build number), so it increments on every
  # push and always matches what the packages report about themselves.
  release:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    needs: [ fetch_build_number, build, package_deb ]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v6
      with:
          fetch-depth: 1

    - uses: actions/download-artifact@v6
      with:
          path: artifacts

      # Only the installable packages are published: the Windows artifact also carries
      # the raw binaries (mumble.exe, the overlay helpers) and the debug symbols, which
      # stay available through the build artifacts. The two .deb artifacts contain
      # identically named packages (the distribution is not part of CPack's file name),
      # so they are renamed after their artifact's label.
    - name: Collect release files
      shell: bash
      run: |
        mkdir release
        find artifacts -name '*.dmg' -exec cp {} release/ \;
        find artifacts \( -name 'mumble_client-*.msi' -o -name 'mumble_client-*.exe' \) -exec cp {} release/ \;
        for deb in artifacts/Mumble-ubuntu-*-deb/*.deb; do
          label="$(basename "$(dirname "$deb")")"
          label="${label#Mumble-}"; label="${label%-deb}"
          cp "$deb" "release/$(basename "$deb" .deb)_${label}.deb"
        done
        ls -l release

    - name: Create release
      shell: bash
      run: |
        version="$(./scripts/mumble-version.py).${{ needs.fetch_build_number.outputs.build_number }}"
        gh release create "v${version}" \
          --title "Mumble ${version}" \
          --notes "Automated build of ${{ github.sha }}." \
          --latest \
          release/*
      env:
          GH_TOKEN: ${{ github.token }}
