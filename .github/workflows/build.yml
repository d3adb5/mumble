name: Build

on:
  push:
    branches: '*'
  pull_request:
    branches: '*'
  workflow_dispatch:

# Only keep the latest run per ref going: a newer push cancels the older,
# still-running build instead of queueing behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release
  # This matrix builds the client only (-Dserver=OFF), which also takes the server's
  # database layer, SOCI and Ice out of the build.
  # -Dwebrtc-audio-processing=ON is the default, but set explicitly so the AEC3 echo
  # cancellation and noise suppression are guaranteed to be compiled in and linked.
  # -Ddeepfilternet=ON builds the bundled DeepFilterNet3 noise suppressor, model
  # included, via the Rust toolchain preinstalled on the GitHub-hosted runners;
  # TestDeepFilterModel then asserts it really ended up in the binary.
  CMAKE_OPTIONS: -Dtests=ON -Dserver=OFF -Dwebrtc-audio-processing=ON -Ddeepfilternet=ON -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_C_COMPILER_LAUNCHER=ccache
  CCACHE_COMPRESSLEVEL: 10
  # Build artifacts count against the repository's storage quota, which has run out before.
  # They only need to outlive the release job (which keeps the packages for good) and leave
  # some time to look at a failed build.
  ARTIFACT_RETENTION_DAYS: 3


jobs:

  fetch_build_number:
    runs-on: ubuntu-latest
    outputs:
      build_number: ${{ steps.fetch.outputs.build_number }}
    steps:
      - uses: actions/checkout@v6
        with:
            fetch-depth: 1
      - id: fetch
        shell: bash
        run: |
          build_version="$("${{ github.workspace }}/scripts/mumble-version.py")"
          build_number="$("${{ github.workspace }}/scripts/mumble-build-number.py" \
            --commit "${{ github.sha }}" --version "${build_version}" \
            --password "${{ secrets.BUILD_NUMBER_TOKEN }}" --default "${{ github.run_number }}")"
          # The central build-number service only assigns numbers for the upstream
          # repository. On forks every build otherwise stayed at build number 0, i.e.
          # the same version (e.g. 1.7.0), so the Windows installer saw no version
          # change and silently refused to update an existing installation. Use the
          # monotonic run number on forks so each build gets a strictly higher version.
          if [ "${{ github.repository }}" != "mumble-voip/mumble" ]; then
            build_number="${{ github.run_number }}"
          fi
          echo "Build Number: ${build_version}.${build_number}"
          echo "build_number=${build_number}" >> "$GITHUB_OUTPUT"


  build:
    needs: [ fetch_build_number ]

    strategy:
        fail-fast: false
        matrix:
            # Ubuntu is not built here but in the container-based job below, which also
            # produces the .deb. What is left is the platform that ships a client disk
            # image: macOS on Apple Silicon (arm64). Windows is not built at all any more
            # (the scripts still support it: add "{ os: windows-2025, type: static,
            # arch: x86_64, compiler: cl }" back here to bring it back).
            include:
              - { os: macos-26, type: static, arch: arm64, compiler: clang }


    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v6
      with:
          submodules: 'recursive'
          fetch-depth: 1


      # The Bash version installed on macOS is ancient. We need a newer version
    - name: Install Bash
      if: ${{ startsWith(matrix.os, 'macos') }}
      run: brew install bash

    - name: Set environment variables
      run: $GITHUB_WORKSPACE/.github/workflows/set_environment_variables.sh "${{ matrix.os }}" "${{ matrix.type }}" "${{ matrix.arch }}" "${{ matrix.compiler }}" "${{ github.workspace }}"
      shell: bash

    - uses: actions/cache/restore@v5
      with:
          path: '${{ env.MUMBLE_ENVIRONMENT_DIR }}'
          key: ${{ env.MUMBLE_ENVIRONMENT_VERSION }}

      # A new (timestamped) cache is saved on every push to master only, which every other
      # branch then restores from: caches count against the same storage quota as artifacts.
    - uses: hendrikmuhs/ccache-action@v1.2.24
      with:
        key: ${{ github.base_ref || github.ref_name }}_${{ matrix.os }}_${{ matrix.type }}.${{ matrix.compiler }}.${{ matrix.arch }}
        save: ${{ github.event_name != 'pull_request' && github.ref_name == 'master' }}

    - uses: ./.github/actions/install-dependencies
      with:
          type: ${{ matrix.type }}
          os: ${{ matrix.os }}
          arch: ${{ matrix.arch }}

    - name: Build
      run: ./.github/workflows/build.sh "${{ matrix.os }}" "${{ matrix.type }}" "${{ matrix.arch }}"
      shell: bash
      env:
          MUMBLE_BUILD_NUMBER: ${{ needs.fetch_build_number.outputs.build_number }}

    - name: Test
      working-directory: ${{ github.workspace }}/build
      shell: bash
      run: ctest --output-on-failure -C $BUILD_TYPE

      # The arm64 runners ship with little free disk, and a static build leaves several
      # gigabytes of intermediates behind - enough that hdiutil is left with nowhere to
      # build the image ("No space left on device"). Past this point nothing is needed
      # but the app bundle and the plugins that go into it.
    - if: ${{ startsWith(matrix.os, 'macos') }}
      name: Free disk space
      shell: bash
      run: |
        df -h /
        du -sh build build_env 2> /dev/null || true

        # The Rust target directory and the (statically linked, hence large) test
        # binaries are the bulk of it; both have served their purpose by now.
        rm -rf build/cargo build/tests
        find build -name '*.o' -delete

        df -h /

      # Turn the built .app into an installable disk image: the plugins and the icon are
      # copied into the bundle, its Info.plist gets the real version, and the result is
      # ad-hoc signed (Apple Silicon refuses to run binaries carrying no signature at
      # all). Signing it with a Developer ID instead needs a paid Apple account, so the
      # image is installed through the Homebrew cask rather than by hand - see
      # docs/dev/maintenance/signing-ci-builds.md.
    - if: ${{ startsWith(matrix.os, 'macos') }}
      name: Create disk image
      shell: bash
      run: |
        ./macx/scripts/osxdist.py --source-dir . --binary-dir build \
          --min-macos-version "15.0.0" \
          --version "$( ./scripts/mumble-version.py ).${MUMBLE_BUILD_NUMBER}"
      env:
          MUMBLE_BUILD_NUMBER: ${{ needs.fetch_build_number.outputs.build_number }}

    - if: ${{ matrix.type == 'static' }}
      name: Publish
      uses: actions/upload-artifact@v7
      with:
        name: 'Mumble-${{ matrix.os }}'
        retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
        # Maximum compression costs far more time than it saves on an artifact that is
        # mostly already-compressed installers and disk images.
        compression-level: 1
        path: |
          build/*.dmg

      # We don't want to save the build env in a cache on a PR as caches are scoped
      # to branches and while PRs can access caches from the default branch, they
      # can't access the cache of other PRs. Hence, it is kind of a waste to save
      # the cache on a PR
    - if: ${{ matrix.type  == 'static' && github.event_name != 'pull_request' }}
      uses: actions/cache/save@v5
      with:
          path: '${{ env.MUMBLE_ENVIRONMENT_DIR }}'
          key: ${{ env.MUMBLE_ENVIRONMENT_VERSION }}


  # Build an installable Mumble client .deb on the Ubuntu releases we target. Neither is
  # available as a GitHub runner image, so their official containers are used. This is a
  # shared build that links against the distribution's system libraries and, being the
  # only Linux build left, it is also the one that runs the test suite there. The server
  # and the 32-bit overlay are left out to keep the package build self-contained on a
  # bare container (no multilib, no database server).
  package_deb:
    needs: [ fetch_build_number ]

    strategy:
        fail-fast: false
        matrix:
            include:
              - { image: "ubuntu:26.04", label: "ubuntu-26.04" }

    runs-on: ubuntu-latest
    container: ${{ matrix.image }}

    steps:
      # git (for the recursive submodule checkout) and the build toolchain have to be
      # installed before anything else, as the base image ships none of them. dpkg-dev
      # provides dpkg-shlibdeps, which CPack uses to resolve the package dependencies.
    - name: Install build dependencies
      shell: bash
      run: |
        export DEBIAN_FRONTEND=noninteractive
        apt-get update
        apt-get install -y --no-install-recommends \
          ca-certificates git cmake ninja-build pkg-config dpkg-dev file python3 \
          build-essential \
          cargo rustc \
          qt6-base-dev qt6-svg-dev qt6-tools-dev qt6-tools-dev-tools qt6-l10n-tools libgl-dev \
          libboost-dev libssl-dev \
          libprotobuf-dev protobuf-compiler libprotoc-dev \
          libcap-dev libxi-dev libpoco-dev \
          libasound2-dev libogg-dev libsndfile1-dev libopus-dev \
          libspeechd-dev libavahi-compat-libdnssd-dev \
          libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev appstream \
          nlohmann-json3-dev libcli11-dev libutfcpp-dev

    - uses: actions/checkout@v6
      with:
          submodules: 'recursive'
          fetch-depth: 1

      # The checkout runs as root inside the container, so mark the tree as a safe
      # git directory to avoid "dubious ownership" errors from any later git calls.
    - name: Mark workspace as safe
      shell: bash
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # warnings-as-errors is left off here: these are bleeding-edge distributions whose
      # GCC keeps gaining new diagnostics, and the goal of this job is to produce a
      # package rather than to gate on them. The matrix above still builds warning-clean
      # with clang.
      # Mumble's dependency provider takes what the distribution packages and fetches the
      # rest (e.g. spdlog, which upstream deliberately does not take from the repositories).
    - name: Configure
      shell: bash
      run: |
        cmake -B build -G Ninja \
          -DCMAKE_PROJECT_TOP_LEVEL_INCLUDES=cmake/mumble_dependency_provider.cmake \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_INSTALL_PREFIX=/usr \
          -DCMAKE_UNITY_BUILD=ON \
          -DBUILD_NUMBER="$MUMBLE_BUILD_NUMBER" \
          -Dtests=ON \
          -Dserver=OFF \
          -Doverlay-xcompile=OFF \
          -Dwarnings-as-errors=OFF \
          -Dwebrtc-audio-processing=ON \
          -Ddeepfilternet=ON \
          -Dstatic=OFF \
          -Ddeb-package=ON
      env:
          MUMBLE_BUILD_NUMBER: ${{ needs.fetch_build_number.outputs.build_number }}

    - name: Build
      shell: bash
      run: cmake --build build --parallel

      # The container has no display, so the tests are run through Qt's offscreen platform
      # plugin (shipped by qt6-base-dev), just like the Linux builds of the matrix did.
    - name: Test
      working-directory: build
      shell: bash
      run: ctest --output-on-failure
      env:
          QT_QPA_PLATFORM: offscreen

    - name: Package
      working-directory: build
      shell: bash
      run: cpack -G DEB

    - name: Publish .deb
      uses: actions/upload-artifact@v7
      with:
        name: 'Mumble-${{ matrix.label }}-deb'
        retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
        compression-level: 9
        path: build/*.deb


  # Build the Arch Linux package (packaging/arch/PKGBUILD) once per CPU target, like the
  # optimized repositories of CachyOS: generic x86-64, the x86-64-v2/v3/v4 levels and the
  # Zen 3/4 microarchitectures. Every variant is the same "mumble-git" package, so installing
  # one replaces any other. Built on Arch's own container, so it links against Arch's (and
  # with that CachyOS') libraries.
  package_arch:
    needs: [ fetch_build_number ]

    strategy:
        fail-fast: false
        matrix:
            # The tests can only run where the runner's CPU can execute the build: every GitHub
            # runner has AVX2 (x86-64-v3), but not necessarily AVX-512 or a Zen CPU.
            include:
              - { march: x86-64,    check: true }
              - { march: x86-64-v2, check: true }
              - { march: x86-64-v3, check: true }
              - { march: x86-64-v4, check: false }
              - { march: znver3,    check: false }
              - { march: znver4,    check: false }

    runs-on: ubuntu-latest
    container: archlinux:base-devel

    steps:
      # multilib provides lib32-gcc-libs, which the 32-bit overlay is built with.
    - name: Prepare the container
      shell: bash
      run: |
        printf '\n[multilib]\nInclude = /etc/pacman.d/mirrorlist\n' >> /etc/pacman.conf
        pacman -Syu --noconfirm --needed git
        # makepkg refuses to run as root; the build user installs the makedepends via sudo.
        useradd --create-home builder
        echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder

    - uses: actions/checkout@v6
      with:
          submodules: 'recursive'
          fetch-depth: 1

      # The PKGBUILD builds from this clone, which makepkg reads as the build user.
    - name: Hand the checkout to the build user
      shell: bash
      run: |
        chown -R builder: "$GITHUB_WORKSPACE"
        sudo -u builder git config --global --add safe.directory '*'

    - name: Build package
      working-directory: packaging/arch
      shell: bash
      run: |
        sudo -u builder env \
          MUMBLE_MARCH='${{ matrix.march }}' \
          MUMBLE_BUILD_NUMBER='${{ needs.fetch_build_number.outputs.build_number }}' \
          makepkg --syncdeps --noconfirm ${{ !matrix.check && '--nocheck' || '' }}

        # The package file name carries the epoch ("1:"), which is awkward in a download, and
        # does not say which CPU it is built for. pacman reads both from the package itself.
        pkg="$(ls mumble-git-[0-9]*.pkg.tar.zst)"
        name="${pkg#mumble-git-*:}"
        mv "$pkg" "mumble-git-${name%.pkg.tar.zst}-${{ matrix.march }}.pkg.tar.zst"
        ls -l *.pkg.tar.zst

    - name: Publish package
      uses: actions/upload-artifact@v7
      with:
        name: 'Mumble-arch-${{ matrix.march }}'
        retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
        # Already zstd-compressed
        compression-level: 0
        path: packaging/arch/mumble-git-*-${{ matrix.march }}.pkg.tar.zst


  # Every push to master becomes a GitHub release carrying the installable client
  # packages: the macOS (arm64) disk image, the Ubuntu .deb of each targeted release and
  # the Arch Linux package for each CPU target. The tag reuses the exact version the builds were stamped
  # with (mumble-version.py plus the monotonic build number), so it increments on every
  # push and always matches what the packages report about themselves.
  release:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    needs: [ fetch_build_number, build, package_deb, package_arch ]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v6
      with:
          fetch-depth: 1

    - uses: actions/download-artifact@v6
      with:
          path: artifacts

      # Only the installable packages are published. The .deb artifacts contain packages
      # whose name does not include the distribution (it is not part of CPack's file name),
      # so they are renamed after their artifact's label.
    - name: Collect release files
      shell: bash
      run: |
        mkdir release
        find artifacts -name '*.dmg' -exec cp {} release/ \;
        for deb in artifacts/Mumble-ubuntu-*-deb/*.deb; do
          label="$(basename "$(dirname "$deb")")"
          label="${label#Mumble-}"; label="${label%-deb}"
          cp "$deb" "release/$(basename "$deb" .deb)_${label}.deb"
        done
        find artifacts -path '*/Mumble-arch-*/*.pkg.tar.zst' -exec cp {} release/ \;
        ls -l release

    - name: Create release
      shell: bash
      run: |
        version="$(./scripts/mumble-version.py).${{ needs.fetch_build_number.outputs.build_number }}"
        cat > notes.md <<EOF
        Automated build of ${{ github.sha }}.

        Arch Linux / CachyOS: pick the \`mumble-git-*.pkg.tar.zst\` for your CPU (on CachyOS, the one
        matching your repositories) and install it with \`sudo pacman -U <file>\`: \`x86-64\` runs
        anywhere, \`x86-64-v2\`/\`v3\`/\`v4\` need a CPU of that level (\`/lib/ld-linux-x86-64.so.2 --help\`
        lists the supported ones), \`znver3\`/\`znver4\` are for AMD Zen 3/Zen 4 (and later).
        EOF
        gh release create "v${version}" \
          --title "Mumble ${version}" \
          --notes-file notes.md \
          --latest \
          release/*
      env:
          GH_TOKEN: ${{ github.token }}
